# Deploy with: npx wrangler deploy   (see worker/README.md)
name = "frlg-dex-sync"
main = "worker.js"
compatibility_date = "2026-10-01"

[vars]
# Only the live site (and local testing) may call the worker.
ALLOWED_ORIGINS = "https://natendogames.github.io,http://localhost:8000"

[[kv_namespaces]]
binding = "SAVES"
id = "PASTE_YOUR_KV_NAMESPACE_ID_HERE"

# Free Cloudflare rate limiter: 20 requests per IP per minute.
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 20, period = 60 }
